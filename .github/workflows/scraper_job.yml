name: Headless Scraper Offload Job

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Target City'
        required: true
        default: 'San Francisco'
      niche:
        description: 'Business Niche'
        required: true
        default: 'Plumbers'

jobs:
  scrape-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Run google-maps-scraper Docker container
        run: |
          echo "Starting Docker scraping engine for ${{{{ github.event.inputs.niche }}}} in ${{{{ github.event.inputs.city }}}}"
          # Example run command for the gosom container
          # docker run -d --name scraper -p 8080:8080 gosom/google-maps-scraper

          # Wait for it to start
          # sleep 5

          # Send job request
          # curl -X POST http://localhost:8080/api/v1/jobs -d '{"queries": ["${{{{ github.event.inputs.niche }}}} in ${{{{ github.event.inputs.city }}}}"], "depth": 5, "email": true, "max_time": 300}'

          echo "Scraping complete."
